name: CI

# Builds and tests on a hosted macOS runner. The packages and the apps only build on macOS (IOUSBHost,
# AVFoundation, Accelerate), so there is no Linux job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: SignalHiveCore tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test SignalHiveCore (hardware tests cancel without a dongle)
        working-directory: Packages/SignalHiveCore
        run: swift test --skip RTLSDRHardwareTests

  driver:
    name: SwiftRTLSDR tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test the embedded driver package
        working-directory: Packages/SwiftRTLSDR
        run: swift test

  apps:
    name: App targets build
    runs-on: macos-26
    timeout-minutes: 60
    # The project targets the macOS/iOS 27 SDK; a runner with an older SDK can fail on API that only newer SDKs have.
    # Keep this job visible but do not let it block the package jobs above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build macOS app
        run: |
          set -o pipefail
          xcodebuild -project SignalHive.xcodeproj -scheme SignalHive -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-macos.log | tail -n 5
      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild -project SignalHive.xcodeproj -scheme SignalHive-iOS -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-ios.log | tail -n 5
      - name: Compiler errors
        if: failure()
        run: |
          for log in build-macos.log build-ios.log; do
            [ -f "$log" ] || continue
            echo "=== $log ==="
            grep -E "error:" "$log" | sort -u | head -100
          done
